[project]
name = "wordup"
version = "0.1.0"
description = "Interactive vocabulary review for your writing, one word at a time, in context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordup"]
